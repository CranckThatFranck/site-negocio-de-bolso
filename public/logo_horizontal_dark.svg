<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <rect width="800" height="200" fill="none"/>
  <svg x="28" y="30" width="140" height="140" viewBox="0 0 100 100">

  <defs>
    <radialGradient id="metalBrushed" cx="55%" cy="48%" r="60%" fx="55%" fy="48%">
      <stop offset="0%" stop-color="#F4F4F5"/>
      <stop offset="28%" stop-color="#A1A1AA"/>
      <stop offset="65%" stop-color="#52525B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </radialGradient>
    <linearGradient id="metalBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#D4D4D8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#18181B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="coinMetal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#D4D4D8"/>
      <stop offset="100%" stop-color="#3F3F46"/>
    </linearGradient>
    <linearGradient id="claspMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="50%" stop-color="#71717A"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>


  <g filter="url(#softShadow)">
    <!-- Moeda / domo superior direito -->
    <path d="M 46 21 C 50 11, 74 11, 80 23 L 46 23 Z" fill="url(#coinMetal)" stroke="url(#metalBevel)" stroke-width="0.9"/>
    <!-- Corpo principal da carteira com recorte de dobra superior e onda de crescimento -->
    <path d="
      M 18 22
      C 12 22, 10 25, 10 31
      L 10 66
      C 10 68, 12 69, 14 68
      C 21 63, 27 52, 37 52
      C 48 52, 57 71, 72 71
      C 79 71, 84 67, 86 62
      L 73 62
      C 63 62, 59 57, 59 49
      C 59 41, 63 36, 73 36
      L 87 36
      C 86 28, 82 25, 73 25
      L 24 25
      C 20 25, 20 29, 24 29
      L 42 29
      L 42 22
      Z" fill="url(#metalBrushed)" stroke="url(#metalBevel)" stroke-width="1"/>
    <!-- Base inferior acompanhando a onda de crescimento -->
    <path d="
      M 11 73
      C 13 84, 18 88, 29 88
      L 69 88
      C 81 88, 86 82, 87 70
      C 83 75, 77 77, 70 77
      C 54 77, 46 58, 37 58
      C 29 58, 22 69, 11 73
      Z" fill="url(#metalBrushed)" stroke="url(#metalBevel)" stroke-width="1"/>
    <!-- Fecho arredondado à direita -->
    <rect x="65" y="40" width="25" height="18" rx="9" fill="url(#claspMetal)" stroke="url(#metalBevel)" stroke-width="1"/>
  </g>

  </svg>
  <text x="192" y="98" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="600" letter-spacing="1.5" fill="#FFFFFF">NEGÓCIO DE BOLSO</text>
  <text x="194" y="138" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="5.5" fill="#A1A1AA">VENDER, CONTROLAR, CRESCER.</text>
</svg>
